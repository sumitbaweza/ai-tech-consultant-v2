{% extends "base.html" %}
{% block shell %}
<div class="auth">
  <div class="card">
    <h1 style="margin-bottom:6px">Create your account</h1>
    <p class="muted">Your business gets its own knowledge, settings and data, separate from every other business.</p>
    {% if error %}<div class="notice bad">{{ error }}</div>{% endif %}
    <form method="post" action="/signup">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" required value="{{ form.name if form else '' }}">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" required value="{{ form.email if form else '' }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <div class="help">At least 8 characters.</div>
      <label for="business_name">Business name</label>
      <input id="business_name" name="business_name" type="text" required value="{{ form.business_name if form else '' }}">
      <div class="form-actions"><button class="btn primary" type="submit">Create account</button></div>
    </form>
    <hr>
    <p class="muted">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
